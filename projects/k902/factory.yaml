# K902「Claude Quickstarts 導讀與互動演練」演練備課工廠的專案設定（lhf 引擎讀這份）
# 以 projects/k145 為藍本。差別：
#   - 教材來源不是書，是官方 repo anthropics/claude-quickstarts（~/workspace/claude-quickstarts，只讀）
#   - 9 章「導讀＋小模擬」、ch03 是「實跑」（匯入官方 agents 模組，經轉接層由真模型驅動）
#   - 共用工具有三支：llm_agent.py、claude_cli_client.py、qs_source.py（都不可改）
#   - 一步裡可能呼叫模型 2 次（工具迴圈），ch10 有一步 3 次，所以指令站逾時拉到 420 秒
# 欄位說明見 templates/kindle-drill/factory.yaml。
schema: 1
name: k902
type: kindle-drill
description: 每一輪備好一章 8 步互動演練（規劃 → 腳本＋教練稿 → 實跑 → 測試判定 → 審查 → commit）
workdir: ~/workspace/kindle-902-claude-quickstarts-factory
branch: factory/drills
agent_cwd: "{PRACTICE}"
read_dirs:
  - "{WORK}/prompts"   # prompts/ 在 worktree 根目錄、不在 cwd(practice) 底下，planner／reviewer 要讀
  - "{WORK}/lessons"   # 講義（每章一份），規劃時對照
  - "{HOME}/workspace/claude-quickstarts"   # 官方原始碼（只讀）：代理沒有 Bash，要用 Read 直接看

vars:
  PRACTICE: "{WORK}/practice"
  INTER: "{PRACTICE}/interactive"
  QS: "{HOME}/workspace/claude-quickstarts"
  common_rules: "\n\n規則：全程使用繁體中文（程式碼本體除外）。絕對不可修改 practice/llm_agent.py、practice/claude_cli_client.py、practice/qs_source.py，也不可修改官方原始碼資料夾裡的任何檔案。不要執行 git，也不要執行任何 shell 指令。只寫入本任務指定的檔案。完成後用一兩句話回報寫了哪些檔案。"

env: {}

units:
  ids: [ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08, ch09, ch10]
  depends_on: {}
  vars:
    num: '^ch0*(\d+)$'   # ch04 → 4（prompt 裡的「第 N 章」）；別用 no／yes 當名稱，YAML 會當成布林

files:
  prompt_md: "{WORK}/prompts/{unit}.md"
  plan: "{RUN}/plans/{unit}.md"
  script: "{INTER}/{unit}.sh"
  coach: "{INTER}/coach-{unit}.txt"
  raw: "{RUN}/test-logs/{unit}-raw.log"
  testlog: "{RUN}/test-logs/{unit}.md"
  review: "{RUN}/reviews/{unit}.md"

extracts: {}

stations:
  - id: plan
    kind: agent
    chain: plan
    label: 1 規劃
    role: planner
    prompt: plan
    requires: ["{prompt_md}"]
    outputs: ["{plan}"]
  - id: write
    kind: agent
    chain: producer
    label: 2 寫腳本＋教練稿
    role: writer
    prompt: write
    mkdirs: ["{INTER}"]
    outputs: ["{script}", "{coach}"]
  - id: run
    kind: command
    chain: verify
    label: 3 執行腳本
    cwd: "{INTER}"
    timeout: 420   # 一步最多呼叫模型 3 次（ch10），每次上限 120 秒，再留餘裕
    require: ["{script}", "{coach}"]
    log: "{raw}"
    fail_report: "{testlog}"
    # 任何一步結束碼非 0 都由引擎直接判 FAIL 並退回，不需要 allow_nonzero
    cmds:
      - {title: "bash -n 語法檢查", cmd: "bash -n {unit}.sh", fail_on_error: true}
      - {title: "第 {step} 步", cmd: "bash {unit}.sh {step}", steps: [1, 8]}
    on_fail: {goto: write, max: 2, label: 測試}
  - id: judge
    kind: agent
    chain: qa
    label: 4 測試判定
    role: tester
    prompt: judge
    clear: ["{testlog}"]
    verdict: {file: "{testlog}"}
    on_fail: {goto: write, max: 2, label: 測試}
  - id: review
    kind: agent
    chain: review
    label: 5 審查
    role: reviewer
    prompt: review
    clear: ["{review}"]
    verdict: {file: "{review}"}
    on_fail: {goto: write, max: 1, label: 審查}
  - id: commit
    kind: commit
    chain: finish
    label: 6 commit
    paths:
      - "practice/interactive/{unit}.sh"
      - "practice/interactive/coach-{unit}.txt"
    message: "工廠：新增 K902 {unit} 互動演練腳本（第 {round} 輪）"

# 意圖合約：每個角色只能用清單上的工具；write 是 Write／Edit 可寫入的位置；budget 是每次呼叫的工具次數上限
# 所有角色都沒有 Bash：測試腳本由引擎自己跑，模型不需要也不該執行指令
roles:
  planner:
    tools: [Read, Glob, Grep, Write]
    write: ["{RUN}/plans/**"]
    budget: 60   # 比 K145 多：要讀官方原始碼確認檔名、函式、常數
  writer:
    tools: [Read, Glob, Grep, Write, Edit]
    write: ["{script}", "{coach}"]   # 鎖到本章檔名，避免順手改到別章的腳本
    budget: 50
  tester:
    tools: [Read, Write]   # 只看 raw log 下判決，不需要搜尋整個 repo
    write: ["{testlog}"]   # 同資料夾的 {raw} 是客觀驗證紀錄，QA 不可改
    budget: 15
  reviewer:
    tools: [Read, Glob, Grep, Write]   # 沒有 Edit：只能寫自己的審查報告，不能動被審的檔案
    write: ["{RUN}/reviews/**"]
    budget: 40

# 三支共用工具被改壞會影響全書；官方原始碼只讀
forbidden:
  paths: ["practice/llm_agent.py", "practice/claude_cli_client.py", "practice/qs_source.py", "workspace/claude-quickstarts/"]
  commands: ["rm -rf", "git push", ".claude/", "ANTHROPIC_API_KEY"]
approval_commands: []

limits:
  calls_per_unit: 10
  agent_timeout: 1500   # k144 的經驗：規劃常貼近 900 秒；本專案規劃還要讀官方原始碼
  feedback_max_chars: 6000

# 退回意見：失敗報告＋實跑 raw log＋審查退回時再附最近一次 QA 報告
feedback_template: "\n\n這是重寫。上一版沒有通過{feedback_label}，原因如下（來自 {feedback_path}）：\n-----\n{feedback_content}\n-----\n實際執行紀錄（{feedback_log}，取檔尾）：\n-----\n{feedback_log_content}\n-----{feedback_qa_section}\n請針對以上問題修正兩個檔案（整檔覆寫），沒問題的步驟保持不變。"

prompts:
  plan: |-
    你是 K902「Claude Quickstarts 導讀與互動演練」的規劃者，負責第 {num} 章（{unit}）。教材來源不是書，是官方 repo anthropics/claude-quickstarts，本機位置 {QS}（只讀）。
    請先閱讀：本章提示詞 {prompt_md}（「這章在講什麼／作者做過的實驗／教練解說要點／演練（說明、練習 1、練習 2）」）；本章講義（{WORK}/lessons/ 底下檔名以 {unit} 開頭的那一份）；格式範本 {INTER}/format-example-k145-ch01.sh、{INTER}/format-example-k145-coach-ch01.txt（這是另一本教材 K145 的成品，只借格式，內容換成本章）；若 {INTER}/ch01.sh 已存在，也照它的寫法；共用工具 {PRACTICE}/llm_agent.py、{PRACTICE}/claude_cli_client.py、{PRACTICE}/qs_source.py 與 {PRACTICE}/README.md（只讀，看介面與限制）；本章提示詞提到的官方原始碼檔案（在 {QS} 底下，用 Read 直接讀，確認檔名、函式名、常數、行號都真的存在，不可以猜）。
    演練類型照本章提示詞「演練」段的說明：「導讀＋小模擬」章是先離線把官方關鍵檔案的結構／常數／流程抽成表，再用「真模型＋假環境」模擬核心迴圈；「實跑」章（只有第 3 章）是直接匯入官方模組（只讀），用轉接層讓真模型驅動。8 步要把練習 1 與練習 2 拆開、由淺入深地做完，練習的提示詞已經把程式要做什麼寫得很具體，照它規劃，不要另外發明題目。
    然後把規劃寫成 Markdown 存到 {plan}。
    規劃剛好 8 步，每步都要有五項：
    1. 標題（一行）
    2. 目的：白話說明這一步要讓學習者懂什麼
    3. 要跑的內嵌 Python（完整可直接執行；cwd 是 practice、PYTHONPATH=.，所以可以直接 import llm_agent、claude_cli_client、qs_source；只用標準庫，不可 pip 安裝任何套件；不可 input()）
    4. 預期看到什麼（具體輸出特徵：表格欄位、關鍵字、數字；離線步驟的結果是確定的，要寫出實際會出現的值，讓測試者能判斷對錯；呼叫模型的步驟寫「流程上一定會出現的東西」與「模型不照格式時會看到的說明」）
    5. 是否呼叫模型（否／是，並寫明這一步最多呼叫幾次）
    限制：
    - 最多 2 步呼叫模型；整章呼叫模型最多 4 次（第 10 章例外：練習 2 那一步可呼叫 3 次，整章最多 4 次）。其他步一律離線、30 秒內跑完。
    - 呼叫模型的步驟一定要容錯：用 claude_cli_client 時先設 os.environ["K902_CLI_MAX_CALLS"] 當保險；自訂工具是「用提示詞模擬的工具呼叫」，模型偶爾不照格式（回覆裡沒有 tool_use），這時程式要印出「這次模型沒有照格式呼叫工具，這是提示詞模擬工具呼叫的限制」之類的說明並照樣把拿到的內容印出來，以結束碼 0 結束；RuntimeError／ValueError（逾時、輸出不是 JSON）也要接住、印出原因、結束碼 0。在呼叫次數上限內可以重試 1 次。後面的步驟若要用到模型那一步的產出檔，檔案不存在時要改用內建範例資料繼續，不可以因此失敗。
    - 讀官方原始碼一律用 qs_source（from qs_source import root, read_text, grep），不可寫死家目錄路徑；官方檔案只讀不改，不安裝它的依賴、不執行它的啟動指令、不需要 Docker、不需要任何 API 金鑰。第 3、10 章可以把 qs_source.root()（或其子資料夾）加進 sys.path 後匯入官方的純 Python 模組；第 3 章要先 claude_cli_client.install() 與 claude_cli_client.install_mcp_stub() 再匯入 agents。
    - 不可設定、讀取或印出任何 API 金鑰；不 mock 模型（假的只能是環境：假知識庫、假瀏覽器、假桌面，並在輸出裡明說哪一部分是假的）。
    - 內嵌 Python 之後會放進 bash 單引號字串、經未加引號的 heredoc 執行：Python 內不可出現單引號、錢字號與反引號（需要時用 chr(39)、chr(36)、chr(96)）；f-string 不可巢狀跳脫雙引號。
    - 不需要互動輸入；要產出的檔案寫到 practice/{unit}/interactive/（程式裡寫相對路徑 {unit}/interactive/…）；每步可重跑（先清掉自己上次的輸出）；第 8 步是本章總結（印 4～6 個重點與本章產出檔案是否存在）。{common_rules}
  write: |-
    你是 K902 第 {num} 章互動演練的寫手。依規劃 {plan} 寫兩個檔案：
    1. {script}：bash 腳本，格式照 {INTER}/format-example-k145-ch01.sh（若 {INTER}/ch01.sh 已存在，也照它的寫法）——開頭註解（章名、用法 bash {unit}.sh <步驟 1-8>、哪幾步會呼叫模型各幾次）、set -u、STEP／HERE／PRACTICE／WORK 變數、相同的 banner／tip／show／run 函式與「👉 第 N 步完成」提示、case 1)～8) 加 *) 預設分支；banner 寫「K902 第 {num} 章｜<短章名>」。PRACTICE="$HERE/.."，run 函式 cd 到 $PRACTICE 並設 PYTHONUTF8=1 PYTHONPATH=.；WORK="$PRACTICE/{unit}/interactive" 並 mkdir -p "$WORK"，所有執行期輸出都寫到 $WORK。腳本要在 cwd＝practice/interactive 時能用 bash {unit}.sh N 執行；每步只執行規劃中的程式，不可讀互動輸入。呼叫模型的步驟在 tip 寫明「會呼叫模型最多 N 次」。
    2. {coach}：教練稿，格式照 {INTER}/format-example-k145-coach-ch01.txt。第一行「K902 第 {num} 章互動演練：<章名>（教練稿）」，空一行後每步一段：「【第 N 步：標題】」換行接 3～5 句白話教練稿（口語、念得出來，說明要做什麼、會看到什麼；用到假環境或「用提示詞模擬的工具呼叫」時要照實說），每段最後一句以「目的，是…」開頭；段與段之間空一行。剛好 8 段。{feedback}{common_rules}
  judge: |-
    你是 K902 第 {num} 章互動演練的測試判定者。讀規劃 {plan} 與實際執行紀錄 {raw}（含 bash -n 結果、bash {unit}.sh 1..8 每步的 exit code、耗時、輸出）。
    逐步對照規劃的「預期看到什麼」判斷每步 PASS 或 FAIL，寫到 {testlog}：
    - 一張表：步驟｜標題｜exit code｜判定｜理由（一句話）
    - FAIL 的步驟寫具體原因與建議怎麼修（給寫手看）
    - 判定原則：exit code 非 0、逾時、出現 Traceback／command not found／No such file／ModuleNotFoundError、輸出明顯與預期不符 → FAIL；數字或措辭的小差異、模型回答文字不同不算 FAIL；呼叫模型的步驟若模型沒照格式呼叫工具，但腳本有印出說明並正常結束，算 PASS（請在理由欄註明）；但若是「呼叫模型失敗」（逾時、找不到 claude、輸出不是 JSON）導致這一步完全沒有拿到模型回覆，算 FAIL（要實際看到真模型的回覆才算驗證過）
    - 檔案最後一行必須單獨是 `VERDICT: PASS`（8 步全過）或 `VERDICT: FAIL`{common_rules}
  review: |-
    你是 K902 第 {num} 章互動演練的審查者（做的人不當審的人）。審查成品：腳本 {script}、教練稿 {coach}；參考規劃 {plan}、測試紀錄 {testlog}、本章提示詞 {prompt_md}、範本 {INTER}/format-example-k145-ch01.sh 與 {INTER}/format-example-k145-coach-ch01.txt；需要核對事實時可讀官方原始碼 {QS}（只讀）。
    審查項目：1. 8 步是否涵蓋本章提示詞「這章在講什麼」與「教練解說要點」的重點、有對應練習 1 與練習 2、順序由淺入深、第 8 步是總結；2. 腳本格式與範本一致、只用標準庫、輸出都在 practice/{unit}/interactive/、不修改三支共用工具與官方原始碼、讀官方原始碼走 qs_source 而且沒有寫死家目錄路徑、不需互動輸入、不設定也不印出任何 API 金鑰、不 mock 模型；3. 教練稿剛好 8 段、每步 3～5 句白話、結尾「目的，是…」、與腳本步驟一一對應，講到官方程式的檔名／函式／常數與原始碼一致，假環境與「用提示詞模擬的工具呼叫」有照實說；4. 呼叫模型的步驟不超過 2 步、整章不超過 4 次（第 10 章一步可 3 次），而且模型不照格式或呼叫失敗時腳本不會當掉。
    寫到 {review}：每項 OK 或問題、必改清單（若有）。最後一行必須單獨是 `VERDICT: PASS` 或 `VERDICT: REJECT`（有任何必改就 REJECT）。{common_rules}

# 假模型模式（LH_FAKE_MODEL=1）各角色要寫的假檔案；判定檔由引擎依站型自動產生
fake:
  planner:
    "{plan}": |
      # {unit} 假規劃

      ## 第 1 步：假步驟 1
      - 目的：測試
      - 指令：echo
      - 預期：印出一行
      - 呼叫模型：否
  writer:
    "{script}": |
      #!/bin/bash
      # {unit} 假腳本
      set -u
      STEP="${1:-1}"
      case "$STEP" in
      1) echo "{unit} 第 1 步（假）" ;;
      2) echo "{unit} 第 2 步（假）" ;;
      3) echo "{unit} 第 3 步（假）" ;;
      4) echo "{unit} 第 4 步（假）" ;;
      5) echo "{unit} 第 5 步（假）" ;;
      6) echo "{unit} 第 6 步（假）" ;;
      7) echo "{unit} 第 7 步（假）" ;;
      8) echo "{unit} 第 8 步（假）" ;;
      *) echo "步驟要 1～8" ;;
      esac
    "{coach}": |
      K902 第 {num} 章互動演練（假教練稿）

      【第 1 步：假步驟 1】
      這是假教練稿。目的，是測試。

# 長時間無人值守時用 Telegram 通知（金鑰只在環境變數 TELEGRAM_BOT_TOKEN／TELEGRAM_CHAT_ID）
notify:
  telegram:
    on: [alert, finish]
